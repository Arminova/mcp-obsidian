[project]
name = "mcp-obsidian"
version = "0.2.2"
description = "MCP server to work with Obsidian via the remote REST plugin - Enhanced fork with runtime config support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
 "mcp>=1.1.0",
 "python-dotenv>=1.0.1",
 "requests>=2.32.3",
]

[[project.authors]]
name = "Markus Pfundstein"
email = "markus@life-electronic.nl"

[[project.authors]]
name = "Arminova"
email = "sunboys@gmail.com"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.389",
]

[project.scripts]
mcp-obsidian = "mcp_obsidian:main"
